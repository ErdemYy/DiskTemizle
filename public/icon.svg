<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#58b0ff"/>
      <stop offset=".5" stop-color="#2160e6"/>
      <stop offset="1" stop-color="#0a2674"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".96" r=".75">
      <stop offset="0" stop-color="#1ee8c4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1ee8c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset=".5" stop-color="#8d9cb8"/>
      <stop offset="1" stop-color="#3d4c6b"/>
    </linearGradient>
    <radialGradient id="platter" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#dde6f4"/>
      <stop offset=".8" stop-color="#a9b8d0"/>
      <stop offset="1" stop-color="#8091ad"/>
    </radialGradient>
    <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="512" cy="540" r="310">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".75"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="320" y1="340" x2="720" y2="760">
      <stop offset="0" stop-color="#26e8c6"/>
      <stop offset=".55" stop-color="#27b4ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <radialGradient id="hub" cx=".4" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#b3c0d6"/>
      <stop offset="1" stop-color="#6c7c9a"/>
    </radialGradient>
    <filter id="blur30" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <clipPath id="platterClip"><circle cx="512" cy="540" r="296"/></clipPath>
  </defs>

  <!-- tile shadow -->
  <rect x="84" y="118" width="856" height="856" rx="208" fill="#00123a" opacity=".34" filter="url(#blur30)"/>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
    <ellipse cx="512" cy="40" rx="600" ry="330" fill="url(#gloss)" opacity=".7"/>
    <rect x="64" y="64" width="896" height="896" rx="208" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="10"/>
  </g>

  <!-- disk drop shadow -->
  <circle cx="512" cy="590" r="300" fill="#00103a" opacity=".55" filter="url(#blur30)"/>

  <!-- rim + platter -->
  <circle cx="512" cy="540" r="314" fill="url(#rim)"/>
  <circle cx="512" cy="540" r="296" fill="url(#platter)"/>
  <circle cx="512" cy="540" r="296" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/>

  <!-- engraved grooves -->
  <g fill="none">
    <circle cx="512" cy="540" r="270" stroke="#1d3158" stroke-opacity=".16" stroke-width="3"/>
    <circle cx="512" cy="540" r="273" stroke="#ffffff" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="512" cy="540" r="246" stroke="#1d3158" stroke-opacity=".14" stroke-width="3"/>
    <circle cx="512" cy="540" r="249" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="512" cy="540" r="166" stroke="#1d3158" stroke-opacity=".16" stroke-width="3"/>
    <circle cx="512" cy="540" r="169" stroke="#ffffff" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="512" cy="540" r="142" stroke="#1d3158" stroke-opacity=".14" stroke-width="3"/>
    <circle cx="512" cy="540" r="145" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <!-- metallic sheen wedges -->
  <g clip-path="url(#platterClip)">
    <path d="M512 540 L655.6 145.3 L856 299.1 Z" fill="url(#sheen)" filter="url(#blur6)"/>
    <path d="M512 540 L368.4 934.7 L168 780.9 Z" fill="url(#sheen)" filter="url(#blur6)"/>
  </g>

  <!-- usage ring: track + glow + arc -->
  <circle cx="512" cy="540" r="206" fill="none" stroke="#0f2350" stroke-opacity=".2" stroke-width="36"/>
  <path d="M512 334 A206 206 0 1 1 309.1 575.8" fill="none" stroke="#27b4ff" stroke-opacity=".7" stroke-width="40" stroke-linecap="round" filter="url(#blur14)"/>
  <path d="M512 334 A206 206 0 1 1 309.1 575.8" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>
  <path d="M512 334 A206 206 0 1 1 309.1 575.8" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" transform="translate(0 -9)" clip-path="url(#platterClip)"/>

  <!-- hub -->
  <circle cx="512" cy="540" r="86" fill="#1c2a47" opacity=".35" filter="url(#blur6)" transform="translate(0 8)"/>
  <circle cx="512" cy="540" r="84" fill="url(#hub)"/>
  <circle cx="512" cy="540" r="84" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="3"/>
  <circle cx="512" cy="540" r="58" fill="none" stroke="#5b6b8a" stroke-opacity=".45" stroke-width="3"/>
  <circle cx="512" cy="540" r="28" fill="#0c2468"/>
  <circle cx="512" cy="540" r="28" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M782 150 Q794 250 894 262 Q794 274 782 374 Q770 274 670 262 Q770 250 782 150 Z" opacity=".55" filter="url(#blur14)"/>
    <path d="M782 150 Q792 252 884 262 Q792 272 782 374 Q772 272 680 262 Q772 252 782 150 Z"/>
    <path d="M258 214 Q264 262 312 268 Q264 274 258 322 Q252 274 204 268 Q252 262 258 214 Z" opacity=".95"/>
    <path d="M818 758 Q823 796 862 801 Q823 806 818 844 Q813 806 774 801 Q813 796 818 758 Z" opacity=".85"/>
  </g>
</svg>
